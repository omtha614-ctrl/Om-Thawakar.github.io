<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visiting Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;

    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .card {
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2rem;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    .profile-image {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }

    .profile-image:hover {
      transform: scale(1.1);
    }

    .card h2 {
      font-size: 1.6rem;
      color: #2c3e50;
      margin-bottom: 0.5rem;
      transition: color 0.3s ease;
    }

    .card h2:hover {
      color: #667eea;
    }

    .card h4 {
      font-size: 1rem;
      font-weight: normal;
      color: #777;
      margin-bottom: 1.2rem;
      transition: color 0.3s ease;
    }

    .card h4:hover {
      color: #764ba2;
    }

    .card ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      text-align: left;
      margin-bottom: 1.5rem;
      color: #2c3e50;
    }

    .card ul li {
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
      line-height: 1.5;
      transition: transform 0.2s ease;
    }

    .card ul li:hover {
      transform: translateX(5px);
    }

    .card ul li a {
      color: #2c3e50;
      text-decoration: none;
      font-weight: 500;
    }

    .card ul li a:hover {
      color: #667eea;
    }

    .card a.btn-primary {
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      margin-top: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
    }

    /* QR Section */
    .qr-section {
      margin-top: 1.5rem;
    }

    .qr-section p {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 0.5rem;
    }

    .qr-code {
      width: 120px;
      height: 120px;
      border: 4px solid #f1f1f1;
      border-radius: 10px;
      padding: 5px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .qr-code:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Profile Photo -->
    <img src="https://i.postimg.cc/t4TQfjMD/Little-girl-faces-children-avatar-people-icon.jpg" alt="Profile" class="profile-image">

    <!-- Personal Info -->
    <h2>Vaishnavi </h2>
    <h4>Student | Web Developer</h4>

    <!-- Contact Info with bullets -->
    <ul>
      <li><b>📞 Phone:</b> +91 9876543210</li>
      <li><b>📧 Email:</b> <span>vaishnavi@example.com</span></li>
    </ul>

    <!-- Portfolio Button -->
    <a href="https://portfolio.com" target="_blank" class="btn-primary">
      <i class="fas fa-external-link-alt"></i> Visit My Portfolio
    </a>

    
  </div>
</body>
</html>
